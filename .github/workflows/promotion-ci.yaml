jobs:
  Build:
    outputs:
      image-tag: ${{ steps.image_tag.outputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/workflows/actions
      - name: Build
        run: mvn clean install -pl promotion -am -DskipTests
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/yas-promotion
          tags: |
            type=sha,format=short,prefix=
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./promotion
          push: true
          tags: ${{ steps.meta.outputs.tags }}

      - name: Image tag
        id: image_tag
        run: echo "tag=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

  update-gitops:
    needs: Build
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/_gitops-deploy-dev.yaml
    with:
      service: promotion
      env: dev
      values-key: backend
      tag: ${{ needs.Build.outputs.image-tag }}
    secrets:
      gitops_pat: ${{ secrets.GITOPS_PAT }}
