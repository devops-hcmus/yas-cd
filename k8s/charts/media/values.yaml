backend:
  replicaCount: 1
  image:
    repository: danzgne/yas-media
    tag: main

  nameOverride: media
  fullnameOverride: media
  databaseName: media
  ingress:
    enabled: false
  # Copy sample product images from yas-sampledata image (same as gitops dev/staging).
  initContainers:
    - name: copy-sample-images
      image: danzgne/yas-sampledata:main
      command: ["sh", "-c", "cp -r /sample-images/sample /images/ && echo 'Images copied'"]
      volumeMounts:
        - name: media-images
          mountPath: /images
  extraVolumes:
    - name: media-application
      configMap:
        name: media-application-configmap
    - name: media-images
      emptyDir: {}
  extraVolumeMounts:
    - name: media-application
      mountPath: /opt/yas/media
    - name: media-images
      mountPath: /images
  extraApplicationConfigPaths:
    - /opt/yas/media/media-application.yaml
