{{- if .Values.mtls.enabled }}
# ============================================================
# PeerAuthentication - STRICT mTLS for all services in namespace
# ============================================================
# Namespace-level PeerAuthentication: LUÔN LUÔN STRICT
# Đảm bảo tất cả traffic nội bộ giữa services phải có mTLS
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: {{ .Release.Namespace }}-strict-mtls
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "service-mesh.labels" . | nindent 4 }}
spec:
  mtls:
    mode: STRICT

---
# ============================================================
# PeerAuthentication - PERMISSIVE for BFF Services (cửa ngõ)
# ============================================================
# BFF là đầu vào cho Frontend/Client, cần cho phép traffic PLAINTEXT
{{- range .Values.bffServices }}
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: {{ . }}-permissive
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "service-mesh.labels" $ | nindent 4 }}
spec:
  selector:
    matchLabels:
      app: {{ . }}
  mtls:
    mode: PERMISSIVE
---
{{- end }}

# ============================================================
# PeerAuthentication - PERMISSIVE for UI Services (cửa ngõ)
# ============================================================
# UI services là frontend, cần cho phép kết nối trực tiếp
{{- range .Values.uiServices }}
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: {{ . }}-permissive
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "service-mesh.labels" $ | nindent 4 }}
spec:
  selector:
    matchLabels:
      app: {{ . }}
  mtls:
    mode: PERMISSIVE
---
{{- end }}

# ============================================================
# PeerAuthentication - PERMISSIVE for Nginx Gateway (cửa ngõ)
# ============================================================
# Nginx Ingress controller cần PERMISSIVE để nhận traffic từ bên ngoài
{{- if .Values.nginxGateway.enabled }}
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: nginx-permissive
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "service-mesh.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app: nginx
  mtls:
    mode: PERMISSIVE
---
{{- end }}

# ============================================================
# DestinationRule - Wildcard mTLS for all services
# ============================================================
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: {{ .Release.Namespace }}-default-mtls
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "service-mesh.labels" . | nindent 4 }}
spec:
  host: "*.{{ .Release.Namespace }}.svc.cluster.local"
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL

---
# ============================================================
# DestinationRule - Per-backend service
# ============================================================
{{- range .Values.backendServices }}
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: {{ .name }}-mtls
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "service-mesh.labels" $ | nindent 4 }}
spec:
  host: {{ .name }}.{{ $.Release.Namespace }}.svc.cluster.local
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
    connectionPool:
      http:
        maxRequestsPerConnection: 100
      tcp:
        maxConnections: 100
---
{{- end }}

# ============================================================
# DestinationRule - Per-BFF service
# ============================================================
{{- range .Values.bffServices }}
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: {{ . }}-mtls
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "service-mesh.labels" $ | nindent 4 }}
spec:
  host: {{ . }}.{{ $.Release.Namespace }}.svc.cluster.local
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
---
{{- end }}

# ============================================================
# DestinationRule - Nginx Gateway
# ============================================================
{{- if .Values.nginxGateway.enabled }}
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: nginx-mtls
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "service-mesh.labels" . | nindent 4 }}
spec:
  host: nginx.{{ .Release.Namespace }}.svc.cluster.local
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
{{- end }}
{{- end }}