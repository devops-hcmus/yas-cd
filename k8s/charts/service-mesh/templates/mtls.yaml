{{- if .Values.mtls.enabled }}
# ============================================================
# 1. KHOÁ CHẶT TOÀN BỘ NAMESPACE BẰNG STRICT mTLS
# ============================================================
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: {{ .Release.Namespace }}-strict-mtls
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "service-mesh.labels" . | nindent 4 }}
spec:
  mtls:
    mode: STRICT

---
# ============================================================
# 2. MỞ PERMISSIVE CHO CÁC CỬA NGÕ (ĐỂ NHẬN INGRESS / NODEPORT)
# ============================================================
{{- range .Values.bffServices }}
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: {{ . }}-permissive
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "service-mesh.labels" $ | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ . }}
  mtls:
    mode: PERMISSIVE
---
{{- end }}

{{- range .Values.uiServices }}
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: {{ .name }}-permissive
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "service-mesh.labels" $ | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .name }}
  mtls:
    mode: PERMISSIVE
---
{{- end }}

# ============================================================
# ALLOW PERMISSIVE CHO BACKEND SERVICES (CẦN CHO HEALTH CHECKS)
# ============================================================
# Backend services cần PERMISSIVE mode để kubelet health checks
# có thể gửi non-mTLS traffic (kubelet không có mTLS certificates).
# Service-to-service traffic vẫn được bảo vệ bởi DestinationRule ISTIO_MUTUAL
{{- range .Values.backendServices }}
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: {{ .name }}-permissive
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "service-mesh.labels" $ | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .name }}
  mtls:
    mode: PERMISSIVE
---
{{- end }}

{{- if .Values.nginxGateway.enabled }}
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: nginx-permissive
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "service-mesh.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{ .Values.nginxGateway.labelKey }}: {{ .Values.nginxGateway.labelValue }}
  mtls:
    mode: PERMISSIVE
---
{{- end }}

# ============================================================
# 3. DESTINATION RULES (ÉP TẤT CẢ CLIENT PHẢI GỬI mTLS)
# ============================================================
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: {{ .Release.Namespace }}-default-mtls
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "service-mesh.labels" . | nindent 4 }}
spec:
  host: "*.{{ .Release.Namespace }}.svc.cluster.local"
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL

---
{{- range .Values.backendServices }}
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: {{ .name }}-mtls
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "service-mesh.labels" $ | nindent 4 }}
spec:
  host: {{ .name }}.{{ $.Release.Namespace }}.svc.cluster.local
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
    connectionPool:
      http:
        maxRequestsPerConnection: 100
      tcp:
        maxConnections: 100
---
{{- end }}

{{- range .Values.bffServices }}
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: {{ . }}-mtls
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "service-mesh.labels" $ | nindent 4 }}
spec:
  host: {{ . }}.{{ $.Release.Namespace }}.svc.cluster.local
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
---
{{- end }}

{{- if .Values.nginxGateway.enabled }}
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: nginx-mtls
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "service-mesh.labels" . | nindent 4 }}
spec:
  host: nginx.{{ .Release.Namespace }}.svc.cluster.local
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
{{- end }}
{{- end }}