# ============================================================
# DestinationRule - Enforce mTLS cho tất cả services trong YAS
# ============================================================
# DestinationRule định nghĩa policies áp dụng cho traffic
# SAU KHI routing đã xảy ra. Ở đây ta dùng để enforce mTLS
# ở phía client (caller) khi gọi tới các services.
#
# trafficPolicy.tls.mode: ISTIO_MUTUAL
#   - Istio tự động quản lý certificates
#   - Sử dụng certificates do Istio CA (citadel) cấp phát
#   - Không cần cấu hình certificate thủ công
#
# Kết hợp với PeerAuthentication STRICT:
#   PeerAuthentication = server-side (yêu cầu client phải gửi mTLS)
#   DestinationRule    = client-side (cấu hình client gửi mTLS)
# ============================================================

# --- DestinationRule mặc định cho toàn bộ namespace ---
# Áp dụng cho mọi service trong namespace yas thông qua wildcard
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
    name: yas-default-mtls
    namespace: { { .Release.Namespace } }
    labels:
        app.kubernetes.io/part-of: yas
        app.kubernetes.io/managed-by: istio
spec:
    host: "*.{{ .Release.Namespace }}.svc.cluster.local"
    trafficPolicy:
        tls:
            mode: ISTIO_MUTUAL

---
# --- DestinationRule riêng cho từng service (chi tiết hơn) ---
# Các rule riêng dưới đây là optional, vì rule wildcard ở trên
# đã cover tất cả. Tuy nhiên, giữ lại để dễ customize sau này
# (ví dụ: thêm connection pool, load balancing policy cho từng service)

apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
    name: product-mtls
    namespace: { { .Release.Namespace } }
spec:
    host: product.{{ .Release.Namespace }}.svc.cluster.local
    trafficPolicy:
        tls:
            mode: ISTIO_MUTUAL
        connectionPool:
            http:
                h2UpgradePolicy: DO_NOT_UPGRADE
                maxRequestsPerConnection: 100
            tcp:
                maxConnections: 100

