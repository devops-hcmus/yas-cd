{{- range .Values.dashboards }}
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: {{ .name }}
spec:
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  folder: {{ .folder | quote }}
  json: |-
{{ $.Files.Get (printf "dashboards/%s" .file) | indent 4 }}
{{- end }}
